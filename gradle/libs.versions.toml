[versions]
agp = "8.13.0"
kotlin = "2.0.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activity = "1.8.0"
constraintlayout = "2.1.4"
firebase-auth-ktx = "24.0.1" # versão estável
firebase-bom = "33.1.2"
lifecycle = "2.6.2"
navigationFragmentKtx = "2.9.5"
navigationUiKtx = "2.9.5"
